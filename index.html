<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="msg" style="display: none;"></p>
    <h2>Registro</h2>

    <form>
        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu nome de Usuário"><br><br>

        <label for="email">E-mail:</label>
        <input type="text" id="email" name="email" placeholder="Digite seu E-mail"><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"><br><br>

        <label for="senhaconfirm">Confirme sua senha:</label>
        <input type="password" id="senhaconfirm" name="senhaconfirm" placeholder="Confirme sua senha"><br><br>

        <button type="button" onclick="RegistraUsuario()">Registrar</button>
        
    </form>
        <script src="script.js"></script>
</body>
        <h3>Já está registrado?</h3> <h4>login</h4>
</html>
